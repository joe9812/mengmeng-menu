<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>mengmeng专属小灶</title>
<style>
  :root {
    --gold: #d4a84b;
    --gold-light: #f5e6c8;
    --bg: #f5f5f3;
    --white: #ffffff;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-gray: #999999;
    --text-light: #666666;
    --border: #e8e8e4;
    --sidebar-bg: #f0f0ee;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-up: 0 -2px 12px rgba(0,0,0,0.06);
    --radius: 16px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: #e8e8e4;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ═══════════════ 手机壳 ═══════════════ */
  .phone {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ═══════════════ 顶部 Banner ═══════════════ */
  .banner {
    height: 160px;
    background: linear-gradient(160deg, #3a2a1a 0%, #5c3d2e 25%, #8b6914 50%, #c4943a 75%, #d4a84b 100%);
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .banner::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 20px;
    background: linear-gradient(to bottom, transparent, var(--bg));
    pointer-events: none;
  }

  /* 顶部图标行 */
  .banner-top-icons {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 2;
  }
  .banner-icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.5);
    background: transparent;
    color: #fff;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .banner-icon-group {
    display: flex;
    gap: 8px;
  }

  /* 头像+标题 */
  .banner-info {
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 1;
    margin-top: 10px;
  }
  .banner-avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2.5px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
  }
  .banner-text h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  .banner-text .sub {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-top: 4px;
    letter-spacing: 2px;
  }

  /* ═══════════════ 搜索+日期行 ═══════════════ */
  .search-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    flex-shrink: 0;
    background: var(--bg);
  }
  .search-box {
    flex: 1;
    height: 36px;
    background: var(--white);
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
    color: var(--text-gray);
    font-size: 13px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    cursor: pointer;
  }
  .date-tag {
    height: 36px;
    background: var(--white);
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 10px 0 14px;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .date-tag .arrow {
    color: var(--text-gray);
    font-size: 10px;
  }

  /* ═══════════════ 主体左右分栏 ═══════════════ */
  .content {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* 左侧分类侧边栏 */
  .sidebar {
    width: 90px;
    background: var(--sidebar-bg);
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display:none; }

  .sidebar-item {
    height: 52px;
    display: flex;
    align-items: center;
    padding-left: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-gray);
    cursor: pointer;
    position: relative;
    border-left: 4px solid transparent;
    transition: all 0.15s;
  }
  .sidebar-item.active {
    color: #1a1a1a;
    font-weight: 700;
    background: var(--white);
    border-left-color: var(--gold);
  }

  /* 右侧菜品区 */
  .dish-area {
    flex: 1;
    background: var(--white);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .dish-area::-webkit-scrollbar { display:none; }

  .dish-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 12px 10px;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 5;
  }
  .dish-header .cat-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .dish-header .cat-count {
    font-size: 13px;
    color: var(--text-gray);
    font-weight: 400;
    margin-left: 2px;
  }
  .dish-header .grid-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #f5f5f3;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 菜品网格 */
  .dish-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 12px 20px;
  }

  .dish-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
  }

  /* 菜品图片区（emoji 占位） */
  .dish-img {
    height: 110px;
    background: #fafaf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }

  /* 菜品信息 */
  .dish-info {
    padding: 10px 10px 40px;
    text-align: center;
  }
  .dish-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  /* 右下角加号按钮 */
  .dish-add-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold);
    border: none;
    color: #fff;
    font-size: 22px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(212,168,75,0.35);
    transition: transform 0.12s;
  }
  .dish-add-btn:active {
    transform: scale(0.9);
  }

  /* ═══════════════ 底部固定栏 ═══════════════ */
  .bottom-bar {
    height: 60px;
    background: var(--white);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
    box-shadow: var(--shadow-up);
    z-index: 20;
  }
  .cart-icon-wrap {
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
  }
  .cart-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f5f5f3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .cart-badge {
    position: absolute;
    top: -2px;
    right: -4px;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    background: var(--gold);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
  }
  .btn-random {
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    border: 1.5px solid var(--gold);
    background: var(--white);
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .btn-random:active {
    background: var(--gold);
    color: #fff;
  }
  .btn-invite {
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    border: 1.5px solid var(--gold);
    background: var(--white);
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .btn-invite:active {
    background: var(--gold-light);
  }
  .btn-order {
    height: 44px;
    padding: 0 22px;
    border-radius: 22px;
    border: none;
    background: linear-gradient(135deg, #c4943a, #d4a84b);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    letter-spacing: 1px;
    box-shadow: 0 3px 12px rgba(212,168,75,0.35);
    transition: transform 0.12s;
  }
  .btn-order:active {
    transform: scale(0.96);
  }

  /* ═══════════════ 购物车弹层 ═══════════════ */
  .cart-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .cart-panel {
    width: 100%;
    max-width: 480px;
    max-height: 60vh;
    background: #fff;
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

  .cart-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .cart-panel-header h3 {
    font-size: 17px;
    font-weight: 700;
  }
  .cart-clear {
    background: none;
    border: none;
    color: var(--text-gray);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cart-panel-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px;
    max-height: 40vh;
  }
  .cart-panel-item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f5f5f3;
    gap: 10px;
  }
  .cart-panel-item .item-emoji {
    font-size: 28px;
    flex-shrink: 0;
  }
  .cart-panel-item .item-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
  }
  .cart-panel-item .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-panel-item .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    line-height: 1;
  }
  .cart-panel-item .qty-btn:active {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .cart-panel-item .qty-num {
    font-size: 15px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
  }
  .cart-panel-footer {
    padding: 12px 20px 24px;
  }
  .cart-panel-footer .btn-order {
    width: 100%;
    text-align: center;
  }

  /* ═══════════════ 日期选择弹层 ═══════════════ */
  .date-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
  }
  .date-panel {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    animation: slideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .date-panel h3 {
    font-size: 17px;
    text-align: center;
    margin-bottom: 16px;
  }
  .date-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .date-option {
    padding: 10px 18px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .date-option.active {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .date-option:active {
    transform: scale(0.95);
  }

  /* ═══════════════ Toast ═══════════════ */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>

<div class="phone">

  <!-- ══════════ 顶部 Banner ══════════ -->
  <div class="banner">
    <div class="banner-top-icons">
      <button class="banner-icon-btn" onclick="history.back()">&lt;</button>
      <div class="banner-icon-group">
        <button class="banner-icon-btn">📋</button>
        <button class="banner-icon-btn">📦</button>
        <button class="banner-icon-btn">🔲</button>
        <button class="banner-icon-btn">🔍</button>
      </div>
    </div>
    <div class="banner-info">
      <div class="banner-avatar">🍚</div>
      <div class="banner-text">
        <h1>今朝专属小灶</h1>
        <div class="sub">好好吃饭</div>
      </div>
    </div>
  </div>

  <!-- ══════════ 搜索+日期行 ══════════ -->
  <div class="search-row">
    <div class="search-box">🔍 <span>搜索</span></div>
    <div class="date-tag" onclick="openDatePicker()">
      📅 <span id="dateLabel">2026-11-10 晚餐</span> <span class="arrow">›</span>
    </div>
  </div>

  <!-- ══════════ 主体：左分类 + 右菜品 ══════════ -->
  <div class="content">
    <!-- 左侧分类 -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 右侧菜品区 -->
    <div class="dish-area" id="dishArea">
      <div class="dish-header">
        <span><span class="cat-title" id="dishCatTitle">荤菜</span><span class="cat-count" id="dishCatCount"></span></span>
        <button class="grid-icon">⊞</button>
      </div>
      <div class="dish-grid" id="dishGrid"></div>
    </div>
  </div>

  <!-- ══════════ 底部固定栏 ══════════ -->
  <div class="bottom-bar">
    <div class="cart-icon-wrap" onclick="openCart()">
      <div class="cart-icon">🛒</div>
      <div class="cart-badge" id="bottomBadge" style="display:none">0</div>
    </div>
    <button class="btn-random" onclick="randomPick()">🎲 随机点菜</button>
    <button class="btn-invite" onclick="inviteOrder()">📨 邀请下单</button>
    <button class="btn-order" onclick="submitOrder()">下单</button>
  </div>

</div>

<!-- ══════════ 购物车弹层 ══════════ -->
<div class="cart-overlay" id="cartOverlay" style="display:none" onclick="if(event.target===this)closeCart()">
  <div class="cart-panel">
    <div class="cart-panel-header">
      <h3>🛒 已选菜品</h3>
      <button class="cart-clear" onclick="clearCart()">🗑 清空</button>
    </div>
    <div class="cart-panel-list" id="cartList"></div>
    <div class="cart-panel-footer">
      <button class="btn-order" onclick="closeCart()">收起点菜</button>
    </div>
  </div>
</div>

<!-- ══════════ 日期选择弹层 ══════════ -->
<div class="date-overlay" id="dateOverlay" style="display:none" onclick="if(event.target===this)closeDatePicker()">
  <div class="date-panel">
    <h3>📅 选择用餐时间</h3>
    <div class="date-options" id="dateOptions"></div>
  </div>
</div>

<!-- ══════════ Toast ══════════ -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// 菜品数据（直接改这个数组即可）
// ═══════════════════════════════════════
const MENU_DATA = [
  // 每个菜品：name 菜名, emoji 图标, category 分类
  // ── 荤菜 ──
  { name:'公瑾爆蛋',       emoji:'🍳', category:'荤菜' },
  { name:'土豆炖牛腩',     emoji:'🥘', category:'荤菜' },
  { name:'青椒肉丝',       emoji:'🌶️', category:'荤菜' },
  { name:'油焖大虾',       emoji:'🍤', category:'荤菜' },
  { name:'糖醋排骨',       emoji:'🍖', category:'荤菜' },
  { name:'可乐鸡翅',       emoji:'🍗', category:'荤菜' },
  { name:'麦辣鸡腿堡',     emoji:'🍔', category:'荤菜' },

  // ── 素菜 ──
  { name:'清炒时蔬',       emoji:'🥬', category:'素菜' },
  { name:'麻婆豆腐',       emoji:'🌶️', category:'素菜' },

  // ── 汤 ──
  { name:'海带排骨汤',     emoji:'🍲', category:'汤' },
  { name:'西红柿蛋汤',     emoji:'🍅', category:'汤' },

  // ── 粥 ──
  { name:'皮蛋瘦肉粥',     emoji:'🥣', category:'粥' },

  // ── 小吃 ──
  { name:'薯条',           emoji:'🍟', category:'小吃' },
  { name:'炸鸡腿',         emoji:'🍗', category:'小吃' },

  // ── 甜品 ──
  { name:'提拉米苏',       emoji:'🍰', category:'甜品' },
  { name:'双皮奶',         emoji:'🍮', category:'甜品' },

  // ── 清淡减负 ──
  { name:'白灼西兰花',     emoji:'🥦', category:'清淡减负' },
  { name:'蒸红薯',         emoji:'🍠', category:'清淡减负' },
  { name:'水煮玉米',       emoji:'🌽', category:'清淡减负' },

  // ── 奖励一下 ──
  { name:'熔岩巧克力蛋糕', emoji:'🧁', category:'奖励一下' },
  { name:'冰淇淋球',       emoji:'🍨', category:'奖励一下' },
  { name:'芝士年糕',       emoji:'🧀', category:'奖励一下' },
];

// 分类顺序（决定左侧栏排列）
const CATEGORY_ORDER = ['荤菜','素菜','汤','粥','小吃','甜品','清淡减负','奖励一下'];

// ═══════════════════════════════════════
// 状态
// ═══════════════════════════════════════
let currentCategory = '荤菜';               // 当前选中分类
let cart = {};                              // { "菜名": 数量 }
let dateOptions = ['2026-11-10 晚餐','2026-11-10 午餐','2026-11-11 早餐','2026-11-11 午餐','2026-11-11 晚餐'];
let currentDate = '2026-11-10 晚餐';

// 从 localStorage 恢复
(function loadState() {
  try {
    const savedCart = localStorage.getItem('mm_cart_v2');
    if (savedCart) cart = JSON.parse(savedCart);
    const savedDate = localStorage.getItem('mm_date_v2');
    if (savedDate) currentDate = savedDate;
  } catch(e) {}
})();

function saveState() {
  try {
    localStorage.setItem('mm_cart_v2', JSON.stringify(cart));
    localStorage.setItem('mm_date_v2', currentDate);
  } catch(e) {}
}

// ═══════════════════════════════════════
// 工具函数
// ═══════════════════════════════════════
function getDishesByCategory(cat) {
  return MENU_DATA.filter(d => d.category === cat);
}

function getCartTotal() {
  return Object.values(cart).reduce((s, v) => s + v, 0);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════
// 渲染——左侧分类栏
// ═══════════════════════════════════════
function renderSidebar() {
  const el = document.getElementById('sidebar');
  let html = '';
  CATEGORY_ORDER.forEach(cat => {
    const active = cat === currentCategory ? ' active' : '';
    html += `<div class="sidebar-item${active}" data-cat="${escHtml(cat)}" onclick="switchCategory('${escHtml(cat)}')">${cat}</div>`;
  });
  el.innerHTML = html;
}

// ═══════════════════════════════════════
// 渲染——右侧菜品网格
// ═══════════════════════════════════════
function renderDishes() {
  const dishes = getDishesByCategory(currentCategory);
  document.getElementById('dishCatTitle').textContent = currentCategory;
  document.getElementById('dishCatCount').textContent = ` (${dishes.length})`;

  const grid = document.getElementById('dishGrid');
  let html = '';
  dishes.forEach(d => {
    const qty = cart[d.name] || 0;
    html += `
      <div class="dish-card">
        <div class="dish-img">${d.emoji}</div>
        <div class="dish-info">
          <div class="dish-name">${escHtml(d.name)}</div>
        </div>
        <button class="dish-add-btn" onclick="event.stopPropagation();addDish('${escHtml(d.name)}')">+</button>
      </div>`;
  });
  grid.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">暂无菜品</div>';

  // 滚动到顶部
  document.getElementById('dishArea').scrollTop = 0;
}

// ═══════════════════════════════════════
// 渲染——购物车弹层
// ═══════════════════════════════════════
function renderCartPanel() {
  const list = document.getElementById('cartList');
  const entries = Object.entries(cart).filter(([,qty]) => qty > 0);

  if (entries.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">🛒 购物车空空如也～</div>';
    return;
  }

  let html = '';
  entries.forEach(([name, qty]) => {
    // 找这道菜的数据
    const dish = MENU_DATA.find(d => d.name === name);
    const emoji = dish ? dish.emoji : '🍽️';
    html += `
      <div class="cart-panel-item">
        <span class="item-emoji">${emoji}</span>
        <span class="item-name">${escHtml(name)}</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${escHtml(name)}', -1)">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="changeQty('${escHtml(name)}', 1)">+</button>
        </div>
      </div>`;
  });
  list.innerHTML = html;
}

// ═══════════════════════════════════════
// 刷新所有 UI
// ═══════════════════════════════════════
function refreshUI() {
  renderSidebar();
  renderDishes();
  updateBadges();
}

function updateBadges() {
  const total = getCartTotal();
  const badge = document.getElementById('bottomBadge');
  if (total > 0) {
    badge.style.display = 'flex';
    badge.textContent = total;
  } else {
    badge.style.display = 'none';
  }
}

// ═══════════════════════════════════════
// 交互——切换分类
// ═══════════════════════════════════════
function switchCategory(cat) {
  currentCategory = cat;
  renderSidebar();
  renderDishes();
}

// ═══════════════════════════════════════
// 交互——添加菜品
// ═══════════════════════════════════════
function addDish(name) {
  cart[name] = (cart[name] || 0) + 1;
  saveState();
  renderDishes();
  updateBadges();
  // 如果购物车弹层开着，同步更新
  if (document.getElementById('cartOverlay').style.display === 'flex') {
    renderCartPanel();
  }
}

// ═══════════════════════════════════════
// 交互——修改数量
// ═══════════════════════════════════════
function changeQty(name, delta) {
  cart[name] = (cart[name] || 0) + delta;
  if (cart[name] <= 0) delete cart[name];
  saveState();
  refreshUI();
  renderCartPanel();  // 购物车弹层同步
}

// ═══════════════════════════════════════
// 交互——随机点菜
// ═══════════════════════════════════════
function randomPick() {
  const dishes = getDishesByCategory(currentCategory);
  if (dishes.length === 0) {
    showToast('当前分类没有菜品');
    return;
  }
  const pick = dishes[Math.floor(Math.random() * dishes.length)];
  addDish(pick.name);
  showToast(`🎲 随机点了「${pick.name}」`);
}

// ═══════════════════════════════════════
// 购物车弹层
// ═══════════════════════════════════════
function openCart() {
  renderCartPanel();
  document.getElementById('cartOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeCart() {
  document.getElementById('cartOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

function clearCart() {
  cart = {};
  saveState();
  refreshUI();
  renderCartPanel();
  showToast('已清空购物车');
}

// ═══════════════════════════════════════
// 日期选择
// ═══════════════════════════════════════
function openDatePicker() {
  const opts = document.getElementById('dateOptions');
  let html = '';
  dateOptions.forEach(d => {
    const active = d === currentDate ? ' active' : '';
    html += `<button class="date-option${active}" onclick="selectDate('${escHtml(d)}')">${d}</button>`;
  });
  opts.innerHTML = html;
  document.getElementById('dateOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeDatePicker() {
  document.getElementById('dateOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

function selectDate(date) {
  currentDate = date;
  document.getElementById('dateLabel').textContent = date;
  saveState();
  closeDatePicker();
}

// ═══════════════════════════════════════
// 下单 & 邀请
// ═══════════════════════════════════════
function submitOrder() {
  const total = getCartTotal();
  if (total === 0) {
    showToast('请先点菜～');
    return;
  }
  // 生成订单文案
  const items = Object.entries(cart).filter(([,qty]) => qty > 0)
    .map(([name, qty]) => `${name} ×${qty}`);
  const msg = `💝 mengmeng专属小灶\n📅 ${currentDate}\n\n${items.join('\n')}\n\n共 ${total} 份，请查收～`;

  // 复制到剪贴板
  navigator.clipboard.writeText(msg).catch(()=>{});
  showToast('已复制订单，发给Ta吧 💌');
}

function inviteOrder() {
  // 复制当前页面链接
  const url = window.location.href || 'https://joe9812.github.io/mengmeng-menu/';
  navigator.clipboard.writeText(url).then(() => {
    showToast('链接已复制，发给Ta来点菜 📨');
  }).catch(() => {
    showToast('链接复制失败，请手动分享');
  });
}

// ═══════════════════════════════════════
// Toast
// ═══════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

// ═══════════════════════════════════════
// 初始化
// ═══════════════════════════════════════
refreshUI();
</script>

</body>
</html>
